<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>InSync Stereo</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#0f1115;color:#eee}
[hidden]{display:none!important}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#171a21}
h1{font-size:1.2rem;margin:0}h1 span{color:#4ade80}
#status{font-size:.8rem;opacity:.7;text-align:right}
main,#landing{max-width:520px;margin:auto;padding:14px}
#landing{display:flex;flex-direction:column;gap:12px;margin-top:40px}
#cam{width:100%;border-radius:10px}
.row{display:flex;gap:8px;align-items:center}
.card{background:#171a21;border-radius:10px;padding:12px;margin:14px 0;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem}
input:not([type=range]):not([type=file]),select{flex:1;padding:10px;border-radius:8px;border:1px solid #333;background:#1c2029;color:#eee}
button,.filebtn{padding:10px 14px;border:0;border-radius:8px;background:#4ade80;color:#000;font-weight:600;cursor:pointer;text-align:center}
#count{font-size:4rem;font-weight:700;text-align:center}
#count:empty{display:none}
#queue{list-style:none;padding:0;margin:10px 0}
#queue li{display:flex;justify-content:space-between;gap:8px;padding:10px;border-radius:8px;background:#171a21;margin-bottom:6px}
#queue li.now{outline:2px solid #4ade80}
#queue li button{background:#333;color:#eee;padding:2px 10px}
#qr{display:flex;justify-content:center;background:#fff;padding:12px;border-radius:10px;width:fit-content;margin:auto}
body.guest .hostonly{display:none}
</style>
</head>
<body>
<header><h1>InSync <span>Stereo</span></h1><div id="status">Ready</div></header>

<div id="landing">
  <button id="hostBtn">Host a session</button>
  <button id="scanBtn">Scan QR to join</button>
  <div class="row"><input id="code" placeholder="…or type room code"><button id="codeBtn">Join</button></div>
  <video id="cam" playsinline muted hidden></video>
</div>

<main id="app" hidden>
  <div id="count"></div>

  <section class="row hostonly">
    <button id="play">▶</button>
    <button id="next">⏭</button>
    <label>Start in
      <select id="delay"><option>3</option><option selected>5</option><option>10</option></select>
    </label>
  </section>

  <section class="hostonly">
    <label class="filebtn">+ Add songs<input type="file" id="files" accept="audio/*" multiple hidden></label>
  </section>

  <ul id="queue"></ul>

  <section class="card">
    <h3>This device</h3>
    <label>Plays
      <select id="chan">
        <option value="left">Left channel</option>
        <option value="right">Right channel</option>
        <option value="both">Both (normal)</option>
      </select>
    </label>
    <label>Volume <input type="range" id="vol" min="0" max="100" value="100"></label>
    <label>Fine-tune: <span id="nv">0</span> ms (+ = later, − = earlier)
      <input type="range" id="nudge" min="-300" max="300" value="0">
    </label>
    <button id="test" class="hostonly">Sync test click</button>
  </section>

  <section id="invite" class="card hostonly">
    <h3>Invite devices</h3>
    <div id="qr"></div>
    <div class="row"><input id="link" readonly><button id="copy">Copy</button></div>
    <p id="devs"></p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const wall = () => performance.timeOrigin + performance.now();   // sub-ms wall clock
let peer, isHost = false, conns = [], hostConn = null;
let offset = 0, bestRtt = Infinity;                               // hostTime = wall() + offset
const hostNow = () => wall() + offset;

let ctx, master, play = null, cdTimer;
const raw = {}, dec = {}, pend = {}, bad = {}, inc = {};          // raw files, decoded buffers, etc.
let state = { queue: [], index: -1, status: 'idle', anchorHost: 0, anchorPos: 0 };

const setStatus = t => $('#status').textContent = t;
const nudge = () => +$('#nudge').value / 1000;
const lat = () => (ctx && ctx.outputLatency) || 0;
const expectedPos = () => state.anchorPos + Math.max(0, (hostNow() - state.anchorHost) / 1000);
const cur = () => state.queue[state.index];
const code6 = () => (Math.random().toString(36) + '000000').slice(2, 8);

/* ---------- Audio engine ---------- */
function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    master = ctx.createGain(); master.gain.value = $('#vol').value / 100; master.connect(ctx.destination);
  }
  if (ctx.state !== 'running') ctx.resume();
  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
}

function decode(id) {                                              // decode lazily to save memory
  if (dec[id] || bad[id] || !raw[id]) return Promise.resolve();
  return pend[id] ||= ctx.decodeAudioData(raw[id].slice(0))        // slice: decode consumes its buffer
    .then(b => { dec[id] = b; })
    .catch(() => { bad[id] = 1; setStatus('Could not decode a file'); })
    .finally(() => { delete pend[id]; });
}
function trim() {                                                  // keep only current + next decoded
  const keep = [cur(), state.queue[state.index + 1]].filter(Boolean).map(s => s.id);
  Object.keys(dec).forEach(id => keep.includes(id) || delete dec[id]);
}

function apply() {
  render();
  if (!ctx) return;
  const tr = cur();
  if (!tr || state.status !== 'playing') { stop(); return; }
  trim();
  if (!dec[tr.id]) {
    if (raw[tr.id] && !bad[tr.id]) decode(tr.id).then(apply);
    else if (!raw[tr.id]) setStatus('Receiving song…');
    return;
  }
  const nx = state.queue[state.index + 1]; if (nx) decode(nx.id);
  const key = tr.id + '|' + state.anchorHost + '|' + $('#chan').value;
  if (!play || play.key !== key) begin(tr, key); else correct();
}
setInterval(apply, 2000);

function begin(tr, key) {
  stop();
  const buf = dec[tr.id], mode = $('#chan').value;
  const src = ctx.createBufferSource(); src.buffer = buf;
  if (buf.numberOfChannels > 1 && mode !== 'both') {               // isolate one channel
    const sp = ctx.createChannelSplitter(2);
    src.connect(sp); sp.connect(master, mode === 'left' ? 0 : 1);  // mono signal → upmixed to both speakers
  } else src.connect(master);

  const w = (state.anchorHost - hostNow()) / 1000;                 // seconds until the shared start
  let when, pos;
  if (w > 0) { when = ctx.currentTime + w + nudge() - lat(); pos = state.anchorPos; countdown(w * 1000); }
  else { when = ctx.currentTime; pos = expectedPos() - nudge() + lat(); }
  const d = when - ctx.currentTime;
  if (d < 0) { pos -= d; when = ctx.currentTime; }
  if (pos >= buf.duration) { if (isHost) next(1.5); return; }

  src.start(when, pos);
  play = { key, src, baseCtx: when, basePos: pos, rate: 1 };
  src.onended = () => { if (play && play.src === src) { play = null; if (isHost) next(1.5); } };
}

function correct() {                                               // drift correction
  if (ctx.currentTime < play.baseCtx + 0.5) return;
  const pos = play.basePos + (ctx.currentTime - play.baseCtx) * play.rate;
  const drift = pos - (expectedPos() - nudge() + lat());
  if (Math.abs(drift) > 0.25) { play.key = ''; apply(); return; }  // hard resync
  const r = Math.abs(drift) > 0.004 ? 1 - Math.max(-0.005, Math.min(0.005, drift * 0.25)) : 1;
  if (r !== play.rate) {
    play.basePos = pos; play.baseCtx = ctx.currentTime; play.rate = r;
    play.src.playbackRate.value = r;
  }
}

function stop() {
  if (play) { play.src.onended = null; try { play.src.stop(); } catch {} play = null; }
  clearInterval(cdTimer); $('#count').textContent = '';
}
function countdown(ms) {
  clearInterval(cdTimer);
  const end = performance.now() + ms, el = $('#count');
  const tick = () => {
    const r = end - performance.now();
    if (r <= 0) { el.textContent = ''; clearInterval(cdTimer); return; }
    el.textContent = Math.ceil(r / 1000);
  };
  tick(); cdTimer = setInterval(tick, 100);
}

function beep(at) {                                                // calibration clicks, all devices
  ensureCtx();
  for (let i = 0; i < 4; i++) {
    const when = ctx.currentTime + (at - hostNow()) / 1000 + i * 0.5 + nudge() - lat();
    if (when <= ctx.currentTime) continue;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 1000; g.gain.setValueAtTime(0.6, when); g.gain.exponentialRampToValueAtTime(0.001, when + 0.06);
    o.connect(g); g.connect(master); o.start(when); o.stop(when + 0.08);
  }
}

/* ---------- Host ---------- */
function hostRoom(id) {
  isHost = true; offset = 0;
  const url = location.origin + location.pathname + '#join=' + id;
  $('#link').value = url;
  new QRCode($('#qr'), { text: url, width: 180, height: 180 });
  setStatus('Host · room ' + id.replace('insync-', ''));
  peer.on('connection', c => {
    c.on('open', () => {
      conns.push(c); c.send({ t: 'state', s: state }); devCount();
      state.queue.forEach(s => sendLater(c, s.id));
    });
    c.on('data', d => { if (d.t === 'ping') c.send({ t: 'pong', c0: d.c0, h: wall() }); });
    c.on('close', () => { conns = conns.filter(x => x !== c); devCount(); });
  });
  setInterval(() => conns.forEach(c => c.open && c.send({ t: 'state', s: state })), 4000);
  devCount();
}
const devCount = () => $('#devs').textContent = (conns.length + 1) + ' device(s) connected';

function push() { conns.forEach(c => c.open && c.send({ t: 'state', s: state })); apply(); }

function sendLater(c, id) { c._q = (c._q || Promise.resolve()).then(() => sendTrack(c, id)); }
async function sendTrack(c, id) {
  const b = raw[id]; if (!b) return;
  const N = 16384, n = Math.ceil(b.byteLength / N);
  c.send({ t: 'meta', id, n });
  for (let i = 0; i < n; i++) {
    while (c.open && c.dataChannel.bufferedAmount > 65536) await new Promise(r => setTimeout(r, 5));
    if (!c.open) return;
    c.send({ t: 'chunk', id, d: b.slice(i * N, (i + 1) * N) });
  }
}

const delay = () => +$('#delay').value;
function playIndex(i, d = delay()) {
  state.index = i; state.status = 'playing'; state.anchorPos = 0; state.anchorHost = hostNow() + d * 1000; push();
}
function togglePlay() {
  ensureCtx();
  if (state.status === 'playing') {
    state.anchorPos = expectedPos(); state.anchorHost = hostNow(); state.status = 'paused';
  } else if (state.queue.length) {
    if (state.index < 0) { state.index = 0; state.anchorPos = 0; }
    state.status = 'playing'; state.anchorHost = hostNow() + delay() * 1000;
  }
  push();
}
function next(d = delay()) {
  if (state.index + 1 < state.queue.length) playIndex(state.index + 1, d);
  else { state.status = 'idle'; state.index = -1; state.anchorPos = 0; push(); }
}
function removeAt(i) {
  delete raw[state.queue[i].id];
  state.queue.splice(i, 1);
  if (i < state.index) state.index--;
  else if (i === state.index) {
    if (state.queue.length) return playIndex(Math.min(i, state.queue.length - 1));
    state.index = -1; state.status = 'idle';
  }
  push();
}

$('#files').onchange = async e => {
  ensureCtx();
  for (const f of e.target.files) {
    const id = code6();
    raw[id] = await f.arrayBuffer();
    state.queue.push({ id, name: f.name.replace(/\.[^.]+$/, '') });
    push();
    conns.forEach(c => sendLater(c, id));
  }
  e.target.value = '';
};

/* ---------- Guest ---------- */
function joinRoom(id) {
  hostConn = peer.connect(id, { reliable: true });
  hostConn.on('open', () => { setStatus('Connected · syncing clock…'); syncClock(20); });
  hostConn.on('close', () => setStatus('Host disconnected'));
  hostConn.on('data', d => {
    if (d.t === 'pong') {
      const c1 = wall(), rtt = c1 - d.c0;
      if (rtt <= bestRtt * 1.2 + 3) {                              // ignore samples slowed by file transfer
        offset = d.h - (d.c0 + c1) / 2; bestRtt = Math.min(bestRtt, rtt);
        if (!Object.keys(inc).length) setStatus('Connected · RTT ' + rtt.toFixed(0) + ' ms');
      }
    } else if (d.t === 'state') {
      state = d.s;
      Object.keys(raw).forEach(id => state.queue.some(s => s.id === id) || delete raw[id]);
      apply();
    } else if (d.t === 'meta') inc[d.id] = { parts: [], n: d.n };
    else if (d.t === 'chunk') {
      const x = inc[d.id]; if (!x) return;
      x.parts.push(d.d);
      setStatus('Receiving ' + Math.round(x.parts.length / x.n * 100) + '%');
      if (x.parts.length === x.n) {
        new Blob(x.parts).arrayBuffer().then(ab => {
          raw[d.id] = ab; delete inc[d.id]; setStatus('Connected · ready'); apply();
        });
      }
    } else if (d.t === 'beep') beep(d.at);
  });
  setInterval(() => hostConn.open && syncClock(6), 30000);
}
function syncClock(n) {
  let i = 0;
  const go = () => { hostConn.send({ t: 'ping', c0: wall() }); if (++i < n) setTimeout(go, 100); };
  go();
}

/* ---------- UI ---------- */
function render() {
  const q = $('#queue'); q.innerHTML = '';
  state.queue.forEach((s, i) => {
    const li = document.createElement('li');
    if (i === state.index) li.className = 'now';
    const span = document.createElement('span');
    span.textContent = s.name + (raw[s.id] ? '' : ' ⏳');           // textContent → no HTML injection
    li.append(span);
    if (isHost) {
      span.style.cursor = 'pointer'; span.onclick = () => playIndex(i);
      const b = document.createElement('button'); b.textContent = '✕'; b.onclick = () => removeAt(i);
      li.append(b);
    }
    q.append(li);
  });
  $('#play').textContent = state.status === 'playing' ? '⏸' : '▶';
  $('#nv').textContent = $('#nudge').value;
}

$('#play').onclick = togglePlay;
$('#next').onclick = () => { ensureCtx(); next(); };
$('#vol').oninput = e => master && (master.gain.value = e.target.value / 100);
$('#nudge').oninput = render;
$('#nudge').onchange = $('#chan').onchange = () => { if (play) play.key = ''; apply(); };
$('#copy').onclick = () => navigator.clipboard.writeText($('#link').value);
$('#test').onclick = () => {
  ensureCtx();
  const at = hostNow() + 2000;
  conns.forEach(c => c.open && c.send({ t: 'beep', at })); beep(at);
};

/* ---------- Boot ---------- */
const toRoom = s => {
  const m = String(s).toLowerCase().match(/insync-[a-z0-9]{6}|^[a-z0-9]{6}$/);
  return m && (m[0].startsWith('insync-') ? m[0] : 'insync-' + m[0]);
};

function start(joinId) {
  if (joinId) document.body.classList.add('guest');
  peer = joinId ? new Peer() : new Peer('insync-' + code6());
  peer.on('open', id => joinId ? joinRoom(joinId) : hostRoom(id));
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { peer.destroy(); return start(); }
    setStatus('Error: ' + e.type);
  });
}
function enter(joinId) {
  ensureCtx();                                                     // needs a tap so audio is allowed
  $('#landing').hidden = true; $('#app').hidden = false; start(joinId);
}

async function scan() {
  if (!('BarcodeDetector' in window)) return alert('QR scanning is not supported here. Type the room code instead.');
  const v = $('#cam');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    v.hidden = false; v.srcObject = stream; await v.play();
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const loop = async () => {
      const r = await det.detect(v).catch(() => []);
      const id = r[0] && toRoom(r[0].rawValue);
      if (id) { stream.getTracks().forEach(t => t.stop()); v.hidden = true; enter(id); }
      else requestAnimationFrame(loop);
    };
    loop();
  } catch { alert('Camera permission denied. Type the room code instead.'); }
}

$('#hostBtn').onclick = () => enter();
$('#scanBtn').onclick = scan;
$('#codeBtn').onclick = () => { const id = toRoom($('#code').value); if (id) enter(id); };
if (location.hash.startsWith('#join=')) $('#code').value = location.hash.slice(6);  // opened from a QR link: tap Join
</script>
</body>
</html>
